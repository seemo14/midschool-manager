  <style>
    /* ===== Quick-add bar ===== */
    .quick-add-bar {
      display:grid;
      grid-template-columns: 130px 110px 70px 70px 1fr 100px auto;
      gap:6px;
      align-items:center;
      background:var(--primary-50);
      border:1px solid var(--primary-100);
      border-radius:var(--radius-lg);
      padding:10px 14px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }
    .quick-add-bar input, .quick-add-bar select {
      padding:5px 8px;
      border:1px solid var(--border);
      border-radius:6px;
      font-size:13px;
      background:var(--card);
      width:100%;
    }
    .quick-add-bar label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--primary); margin-bottom:2px; display:block; }
    @media(max-width:900px){ .quick-add-bar { grid-template-columns:1fr 1fr; } }
    @media(max-width:540px){ .quick-add-bar { grid-template-columns:1fr; } }

    /* ===== Lesson table enhancements ===== */
    .lessons-view-tabs { display:flex; gap:4px; margin-bottom:16px; }
    .lessons-view-tab { padding:7px 16px; font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; border:1px solid var(--border); background:var(--card); border-radius:var(--radius-md); transition:all .15s; }
    .lessons-view-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }

    /* class-grouped view */
    .class-group { margin-bottom:24px; }
    .class-group__header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius-md); margin-bottom:8px; cursor:pointer; }
    .class-group__name { font-weight:700; font-size:15px; }
    .class-group__count { font-size:12px; color:var(--text-secondary); margin-left:auto; }
    .class-group__body { border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }

    /* Inline editable table */
    .lessons-tbl { width:100%; border-collapse:collapse; font-size:13px; }
    .lessons-tbl th { background:var(--bg-secondary); padding:9px 12px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-secondary); border-bottom:2px solid var(--border); white-space:nowrap; }
    .lessons-tbl td { padding:7px 10px; border-bottom:1px solid var(--border-light); vertical-align:middle; }
    .lessons-tbl tr:last-child td { border-bottom:none; }
    .lessons-tbl tr:hover td { background:var(--bg-secondary); }
    .lessons-tbl .time-col { font-family:monospace; font-size:12px; color:var(--text-secondary); }

    /* Bulk select */
    .bulk-toolbar { display:none; background:var(--primary); color:#fff; border-radius:var(--radius-md); padding:10px 16px; margin-bottom:12px; align-items:center; gap:12px; flex-wrap:wrap; }
    .bulk-toolbar.visible { display:flex; }
    .bulk-toolbar span { font-weight:600; font-size:14px; }
    .bulk-toolbar .btn { background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.3); }
    .bulk-toolbar .btn:hover { background:rgba(255,255,255,.25); }
    .bulk-toolbar .btn-danger { background:rgba(220,38,38,.8); border-color:rgba(220,38,38,.9); }
    .row-check { width:16px; height:16px; cursor:pointer; }
  </style>
</head>

  <main class="main-content">
    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumbs"></nav>

    <div class="page-header">
      <h2>Lesson Records</h2>
      <div class="page-header__actions">
        <a href="teaching-hub.html" class="btn btn-secondary" title="Bulk log from pasted plan">⚡ Bulk Generate</a>
        <button class="btn btn-primary" id="btnNewLesson">+ New Record</button>
      </div>
    </div>

    <!-- Quick-add bar -->
    <div class="quick-add-bar" id="quickAddBar">
      <div>
        <label>Class</label>
        <select id="qaClass"></select>
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="qaDate">
      </div>
      <div>
        <label>Time</label>
        <input type="time" id="qaTime" value="">
      </div>
      <div>
        <label>Period</label>
        <select id="qaPeriod">
          <option value="">—</option>
          <option value="1">P1</option><option value="2">P2</option><option value="3">P3</option>
          <option value="4">P4</option><option value="5">P5</option><option value="6">P6</option><option value="7">P7</option>
        </select>
      </div>
      <div>
        <label>Topic <span style="color:var(--danger)">*</span></label>
        <input type="text" id="qaTopic" placeholder="e.g. Present Simple - Negatives" style="width:100%">
      </div>
      <div>
        <label>Status</label>
        <select id="qaStatus">
          <option value="completed">✅ Done</option>
          <option value="partial">🟡 Partial</option>
          <option value="not_started">🔴 Not Started</option>
          <option value="skipped">⏭ Skipped</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="btn btn-primary btn-sm" id="btnQuickSave" style="white-space:nowrap;padding:7px 14px">+ Add</button>
      </div>
    </div>

    <!-- Filters + view toggle -->
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px">
      <div class="filter-bar" style="margin-bottom:0;flex:1;flex-wrap:wrap">
        <div class="form-group"><label for="filterClass">Class</label><select id="filterClass"></select></div>
        <div class="form-group"><label for="filterStatus">Status</label>
          <select id="filterStatus">
            <option value="">All</option>
            <option value="completed">Completed</option>
            <option value="partial">Partial</option>
            <option value="not_started">Not Started</option>
            <option value="skipped">Skipped</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:150px"><label for="filterSearch">Search</label><input type="text" id="filterSearch" placeholder="Search topics..."></div>
        <div class="form-group"><label for="filterDateFrom">From</label><input type="date" id="filterDateFrom"></div>
        <div class="form-group"><label for="filterDateTo">To</label><input type="date" id="filterDateTo"></div>
      </div>
      <div class="lessons-view-tabs" style="margin-bottom:0;flex-shrink:0">
        <button class="lessons-view-tab active" data-view="table">List</button>
        <button class="lessons-view-tab" data-view="grouped">By Class</button>
      </div>
    </div>

    <!-- Bulk toolbar -->
    <div class="bulk-toolbar" id="bulkToolbar">
      <span id="bulkCount">0 selected</span>
      <select id="bulkStatusSel" style="padding:5px 8px;border-radius:6px;font-size:13px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff">
        <option value="">Change status to…</option>
        <option value="completed">✅ Completed</option>
        <option value="partial">🟡 Partial</option>
        <option value="not_started">🔴 Not Started</option>
        <option value="skipped">⏭ Skipped</option>
      </select>
      <button class="btn" id="btnBulkStatus">Apply Status</button>
      <button class="btn btn-danger" id="btnBulkDelete">🗑 Delete Selected</button>
      <button class="btn" id="btnBulkClear" style="margin-left:auto">✕ Clear</button>
    </div>
