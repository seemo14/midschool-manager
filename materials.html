  <style>
    .materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-md); }
    .material-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-lg); transition: box-shadow var(--transition-fast); }
    .material-card:hover { box-shadow: var(--shadow-md); }
    .material-card__header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-sm); }
    .material-card__type { font-size: 24px; }
    .material-card__title { font-weight: 600; font-size: var(--text-base); margin-bottom: var(--space-xs); }
    .material-card__meta { font-size: var(--text-xs); color: var(--text-secondary); margin-bottom: var(--space-sm); }
    .material-card__tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--space-sm); }
    .material-card__tag { font-size: 11px; padding: 2px 8px; background: var(--bg); border-radius: var(--radius-full); color: var(--text-secondary); }
    .material-card__actions { display: flex; gap: var(--space-xs); margin-top: var(--space-md); border-top: 1px solid var(--border); padding-top: var(--space-sm); }
    .view-toggle { display: flex; gap: 2px; background: var(--bg); border-radius: var(--radius-md); padding: 2px; }
    .view-toggle__btn { padding: 6px 12px; border-radius: var(--radius-sm); font-size: var(--text-sm); cursor: pointer; border: none; background: none; color: var(--text-secondary); }
    .view-toggle__btn--active { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
  </style>
</head>
