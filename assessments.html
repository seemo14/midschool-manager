  <style>
    /* View Tabs */
    .view-tabs {
      display: flex; gap: 2px; background: var(--bg-secondary);
      border-radius: var(--radius-md); padding: 4px; margin-bottom: var(--space-lg); width: fit-content;
    }
    .view-tab {
      padding: 8px 20px; border-radius: var(--radius-sm); font-size: var(--text-sm);
      font-weight: 600; cursor: pointer; border: none; background: none;
      color: var(--text-secondary); transition: all var(--transition-fast);
    }
    .view-tab:hover { color: var(--text); }
    .view-tab--active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

    /* Student Panel Layout */
    .student-panel { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-lg); min-height: 500px; }
    @media (max-width: 900px) { .student-panel { grid-template-columns: 1fr; } }

    /* Student List */
    .student-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .student-list__header { padding: var(--space-sm) var(--space-md); background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .student-list__header input { border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; font-size: var(--text-sm); width: 100%; }
    .student-list__items { max-height: 550px; overflow-y: auto; }
    .student-list__item {
      padding: 10px var(--space-md); cursor: pointer; font-size: var(--text-sm);
      border-bottom: 1px solid var(--border-light); transition: all var(--transition-fast);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .student-list__item:hover { background: var(--primary-light); }
    .student-list__item--active { background: var(--primary-light); color: var(--primary); font-weight: 600; border-left: 3px solid var(--primary); }
    .student-list__item:last-child { border-bottom: none; }

    /* Student Detail */
    .student-detail { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-xl); }
    .student-detail__name { font-size: var(--text-xl); font-weight: 800; margin-bottom: 2px; letter-spacing: -0.02em; }
    .student-detail__meta { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-md); }
    .avg-display { font-size: var(--text-3xl); font-weight: 800; margin-bottom: var(--space-lg); letter-spacing: -0.03em; }

    /* Grade Sheet */
    .grade-sheet { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
    .grade-sheet table { min-width: 100%; font-size: var(--text-sm); }
    .grade-sheet th, .grade-sheet td { padding: 8px 12px; border: 1px solid var(--border-light); text-align: center; }
    .grade-sheet th { background: var(--bg-secondary); font-weight: 600; white-space: nowrap; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-secondary); }
    .grade-sheet td.name-cell { text-align: left; white-space: nowrap; font-weight: 500; position: sticky; left: 0; background: var(--card); z-index: 1; }
    .grade-sheet .avg-col { background: var(--primary-light); font-weight: 700; }
    .grade-sheet tbody tr { transition: background var(--transition-fast); }
    .grade-sheet tbody tr:hover { background: var(--primary-50); }
    .grade-sheet tfoot th { background: var(--bg-secondary); font-weight: 700; color: var(--text); }

    /* Batch Row */
    .batch-row {
      display: grid; grid-template-columns: 2fr 80px 1fr; gap: var(--space-sm);
      align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-light);
    }
    .batch-row:last-child { border-bottom: none; }
    .batch-row__name { font-size: var(--text-sm); font-weight: 500; }

    /* Observation card */
    .obs-card {
      padding: 12px 14px; background: var(--bg-secondary); border-radius: var(--radius-md);
      margin-bottom: 8px; font-size: var(--text-sm); border-left: 3px solid var(--primary);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .obs-card__content { flex: 1; }
    .obs-card__date { font-weight: 600; color: var(--text); margin-right: 8px; }

    /* Action buttons bar */
    .detail-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-lg); padding-top: var(--space-md); border-top: 1px solid var(--border-light); }

    /* Progress sparkline */
    .sparkline { display: inline-block; vertical-align: middle; }
    .sparkline svg { display: block; }

    /* Inline editable cells */
    .grade-sheet td.editable { cursor: pointer; position: relative; }
    .grade-sheet td.editable:hover { background: var(--primary-light); }
    .grade-sheet td.editable input {
      width: 48px; text-align: center; padding: 2px 4px;
      border: 2px solid var(--primary); border-radius: 4px;
      font-size: inherit; font-weight: 600; outline: none;
    }
    .grade-sheet td.editable .saved-indicator {
      position: absolute; top: 2px; right: 2px;
      font-size: 10px; color: var(--success); opacity: 0;
      transition: opacity 0.3s;
    }
    .grade-sheet td.editable .saved-indicator.show { opacity: 1; }
  </style>
